services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-tracker}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tracker}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Only the two bootstrap secrets live here. Everything else — Google OAuth
    # credentials, the allowed-email list, the upload limit — is configured in
    # the app's UI on first run and stored (encrypted) in the database.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-tracker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-tracker}?schema=public
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      # Optional: public URL behind your Cloudflare tunnel. If unset, the app
      # infers it from request headers (trustHost).
      AUTH_URL: ${AUTH_URL}
      UPLOAD_DIR: /data/uploads
      NODE_ENV: production
    volumes:
      - uploads:/data/uploads
    # Publish the app on a host port. Bound to localhost by default so it isn't
    # exposed on your LAN — point your Cloudflare tunnel (or a reverse proxy) at
    # http://localhost:${APP_PORT}. To reach it from other machines on the LAN,
    # set APP_BIND=0.0.0.0 in .env. If cloudflared runs as its own container on
    # this Compose network, it can also reach the app directly at http://app:3000.
    ports:
      - "${APP_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    expose:
      - "3000"
    # Probe 127.0.0.1, not "localhost": on Alpine, "localhost" can resolve to
    # the IPv6 loopback (::1), but the Next.js server listens on IPv4 only
    # (HOSTNAME=0.0.0.0), so a localhost probe gets "connection refused" and
    # the container is marked unhealthy even though the app is fine. Uses
    # Node's built-in fetch so it doesn't depend on busybox wget.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  db-data:
  uploads:
